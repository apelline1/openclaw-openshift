apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apelline-dev

resources:
  - serviceaccount.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  # secret.yaml is intentionally NOT listed — never commit secrets.
  # Apply it once manually: oc apply -f manifests/secret.yaml.template
  # (after filling in real values and renaming to secret.yaml)
