apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Remove storageClassName to use your cluster's default storage class,
  # or set it explicitly (e.g. gp3-csi on ROSA, ocs-storagecluster-ceph-rbd on ODF)
  # storageClassName: gp3-csi
