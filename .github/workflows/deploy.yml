name: Build & Deploy OpenClaw to OpenShift

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual runs from the GitHub UI

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. apelline/openclaw-openshift
  OPENSHIFT_NAMESPACE: apelline-dev

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build the container image and push to GitHub Container Registry (GHCR)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Deploy to OpenShift
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: build
    environment: production   # optional: add manual approval gate in GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: false   # set true only for self-signed certs

      - name: Patch image tag in manifests
        # Replace the placeholder image reference with the exact SHA digest
        # built in the previous job so deployments are always reproducible.
        run: |
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          sed -i "s|ghcr.io/YOUR_GITHUB_ORG/openclaw-openshift:latest|${IMAGE}|g" \
            manifests/deployment.yaml

      - name: Apply manifests (Kustomize)
        run: |
          oc apply -k manifests/ --server-side

      - name: Wait for rollout
        run: |
          oc rollout status deployment/openclaw -n ${{ env.OPENSHIFT_NAMESPACE }} \
            --timeout=180s

      - name: Print Route URL
        run: |
          echo "✅ OpenClaw is live at:"
          oc get route openclaw -n ${{ env.OPENSHIFT_NAMESPACE }} \
            -o jsonpath='https://{.spec.host}{"\n"}'
